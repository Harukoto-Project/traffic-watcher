[package]
name = "monitor-ipc"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Named Pipe protocol and query engine for traffic-watcher"

[dependencies]
anyhow = "1.0.104"
monitor-storage = { version = "0.1.0", path = "../storage", package = "monitor-storage" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "sync", "time", "macros"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }
