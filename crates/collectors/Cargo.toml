[package]
name = "monitor-collectors"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Ping, system and process collectors for traffic-watcher"

[dependencies]
anyhow = "1.0.104"
monitor-core = { version = "0.1.0", path = "../core" }
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "network", "disk"] }
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
tokio-util = "0.7.20"
tracing = "0.1.44"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
