[package]
name = "monitor-alert"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "Alert rules, condition parser and Discord webhook notifier for traffic-watcher"

[dependencies]
anyhow = "1.0.104"
monitor-core = { version = "0.1.0", path = "../core", package = "monitor-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "native-tls", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "time"] }
tracing = "0.1.44"
