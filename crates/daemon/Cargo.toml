[package]
name = "monitord"
edition.workspace = true
version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
description = "monitord: Windows monitoring daemon for ping spikes and system load correlation"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
monitor-alert = { version = "0.1.0", path = "../alert", package = "monitor-alert" }
monitor-collectors = { version = "0.1.0", path = "../collectors", package = "monitor-collectors" }
monitor-core = { version = "0.1.0", path = "../core", package = "monitor-core" }
monitor-ipc = { version = "0.1.0", path = "../ipc", package = "monitor-ipc" }
monitor-storage = { version = "0.1.0", path = "../storage", package = "monitor-storage" }
notify = "8.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = "0.3.23"
windows-service = "0.8.1"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3.27.0"
